name: Extract VYRAL Production Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-vyral:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and extract VYRAL ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

          if [ -z "${ZIP_FILE}" ]; then
            echo "ERROR: No ZIP file found in the repository."
            exit 1
          fi

          echo "Using: ${ZIP_FILE}"

          rm -rf .vyral_extract
          mkdir -p .vyral_extract

          unzip -q "$ZIP_FILE" -d .vyral_extract

          # Detect whether the ZIP has a single top-level directory.
          ROOT="$(find .vyral_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          if [ -n "$ROOT" ] && [ "$(find .vyral_extract -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]; then
            SOURCE="$ROOT"
          else
            SOURCE=".vyral_extract"
          fi

          echo "Extracted source: $SOURCE"

          # Preserve the archive and workflow, but replace the repository's
          # application files with the extracted production source.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '*.zip' \
            ! -name '.vyral_extract' \
            -exec rm -rf {} +

          cp -a "$SOURCE"/. .

          rm -rf .vyral_extract

      - name: Verify extracted project
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f server.ts
          test -d src
          test -d drizzle

          echo "VYRAL extraction verification passed."
          echo
          echo "Top-level files:"
          ls -la

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract VYRAL production source from package"
          git push
