name: Extract VYRAL Production Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    name: Extract audited VYRAL source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify audited ZIP exists
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="VYRAL_final_audited_postextract.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            echo "ZIP files currently in repository:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Using audited package:"
          echo "$ZIP_FILE"

      - name: Extract VYRAL source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="VYRAL_final_audited_postextract.zip"
          EXTRACT_DIR=".vyral_extract"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting $ZIP_FILE..."
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "Extracted contents:"
          find "$EXTRACT_DIR" -maxdepth 3 -type f | sort

      - name: Locate project root
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR=".vyral_extract"

          # Find package.json anywhere inside the extracted archive.
          PACKAGE_JSON="$(find "$EXTRACT_DIR" -type f -name "package.json" | head -n 1)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$PACKAGE_JSON")"

          echo "VYRAL project root:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Replace repository with extracted source
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing old repository files..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "VYRAL_final_audited_postextract.zip" \
            ! -name "VYRAL_final_production_ready.zip" \
            ! -name ".vyral_extract" \
            -exec rm -rf {} +

          echo "Copying VYRAL source..."

          cp -a "$PROJECT_ROOT"/. .

          rm -rf .vyral_extract

      - name: Verify VYRAL project
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying extracted project..."

          test -f package.json
          test -f server.ts
          test -d src
          test -d drizzle

          echo
          echo "Verification successful."
          echo
          echo "VYRAL source tree:"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            ! -name "*.zip" \
            | sort

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Extract audited VYRAL production source"

      - name: Push extracted source
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main
