name: VYRAL Consolidate, Verify & Package

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: "Commit the verified consolidated source back to main"
        required: true
        default: false
        type: boolean

      zip_path:
        description: "Path to the VYRAL ZIP file in the repository"
        required: true
        default: "VYRAL_consolidated_full_build.zip"
        type: string

permissions:
  contents: write

concurrency:
  group: vyral-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    name: Consolidate, Test & Package VYRAL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: vyral
          POSTGRES_PASSWORD: vyral
          POSTGRES_DB: vyral_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U vyral -d vyral_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://vyral:vyral@localhost:5432/vyral_test
      DIRECT_URL: postgresql://vyral:vyral@localhost:5432/vyral_test

      TEST_DATABASE_ADMIN_URL: postgresql://vyral:vyral@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://vyral:vyral@localhost:5432/vyral_test

      NODE_ENV: test
      CI: true
      AUTH_SECRET: github-actions-vyral-test-secret

      STORAGE_PROVIDER: local
      STORAGE_LOCAL_DIR: ./storage-test

      NEXT_TELEMETRY_DISABLED: 1

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " ENVIRONMENT"
          echo "============================================================"

          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "Git:"
          git --version

          echo
          echo "Unzip:"
          unzip -v | head -1

          echo
          echo "Working directory:"
          pwd

          echo
          echo "Repository:"
          git remote get-url origin || true

          echo
          echo "Current commit:"
          git rev-parse HEAD


      # ============================================================
      # FIND ZIP
      # ============================================================

      - name: Locate VYRAL ZIP
        id: locate_zip
        shell: bash
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail

          echo "Looking for VYRAL ZIP:"
          echo "$ZIP_PATH"

          if [[ ! -f "$ZIP_PATH" ]]; then
            echo "::error::VYRAL ZIP was not found at: $ZIP_PATH"

            echo
            echo "ZIP files currently present:"

            find . \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              ! -path "./.git/*" \
              -print

            exit 1
          fi

          echo
          echo "ZIP found:"
          ls -lh "$ZIP_PATH"

          echo
          echo "ZIP contents preview:"
          unzip -l "$ZIP_PATH" | head -80

          echo "zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"


      # ============================================================
      # EXTRACT ZIP
      # ============================================================

      - name: Extract VYRAL ZIP
        id: unpack
        shell: bash
        env:
          ZIP_PATH: ${{ steps.locate_zip.outputs.zip }}
        run: |
          set -euo pipefail

          rm -rf _vyral_zip

          mkdir -p _vyral_zip

          echo "Extracting:"
          echo "$ZIP_PATH"

          unzip -q "$ZIP_PATH" -d _vyral_zip

          echo
          echo "Extracted files:"
          find _vyral_zip \
            -maxdepth 4 \
            -type f \
            | head -150

          ROOT="_vyral_zip"

          # --------------------------------------------------------
          # Detect package.json
          # --------------------------------------------------------

          if [[ -f "$ROOT/package.json" ]]; then

            echo
            echo "Project root detected directly in ZIP."

          else

            echo
            echo "Searching for package.json..."

            mapfile -t candidates < <(
              find "$ROOT" \
                -mindepth 1 \
                -maxdepth 5 \
                -type f \
                -name package.json \
                -print
            )

            if [[ "${#candidates[@]}" -eq 0 ]]; then
              echo "::error::No package.json was found inside the ZIP."
              exit 1
            fi

            if [[ "${#candidates[@]}" -gt 1 ]]; then
              echo "::warning::Multiple package.json files detected:"
              printf '%s\n' "${candidates[@]}"
            fi

            PACKAGE_FILE="${candidates[0]}"

            ROOT="$(dirname "$PACKAGE_FILE")"

          fi

          echo
          echo "Detected project root:"
          echo "$ROOT"

          test -f "$ROOT/package.json"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"


      # ============================================================
      # VALIDATE PROJECT
      # ============================================================

      - name: Validate extracted VYRAL project
        shell: bash
        env:
          ROOT: ${{ steps.unpack.outputs.root }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " PROJECT VALIDATION"
          echo "============================================================"

          test -f "$ROOT/package.json"

          if [[ -f "$ROOT/package-lock.json" ]]; then
            echo "✓ package-lock.json found"
          else
            echo "::warning::No package-lock.json found."
            echo "npm install will be used."
          fi

          if [[ -f "$ROOT/next.config.js" ||
                -f "$ROOT/next.config.mjs" ||
                -f "$ROOT/next.config.ts" ]]; then
            echo "✓ Next.js configuration detected"
          fi

          if [[ -f "$ROOT/drizzle.config.ts" ||
                -f "$ROOT/drizzle.config.js" ]]; then
            echo "✓ Drizzle configuration detected"
          fi

          if [[ -d "$ROOT/drizzle" ]]; then
            echo "✓ Drizzle migrations directory detected"
          fi

          if [[ -f "$ROOT/prisma/schema.prisma" ]]; then
            echo "✓ Prisma schema detected"
          fi

          if [[ -d "$ROOT/src" ]]; then
            echo "✓ src/ directory detected"
          fi

          if [[ -d "$ROOT/public" ]]; then
            echo "✓ public/ directory detected"
          fi

          echo
          echo "Package information:"

          node -e "
            const fs = require('fs');
            const p = JSON.parse(
              fs.readFileSync('$ROOT/package.json', 'utf8')
            );

            console.log('name:', p.name || '(unnamed)');
            console.log('version:', p.version || '(none)');
            console.log('private:', p.private ?? false);

            console.log(
              'package manager:',
              p.packageManager || '(not specified)'
            );

            console.log(
              'scripts:',
              Object.keys(p.scripts || {}).join(', ') || '(none)'
            );
          "


      # ============================================================
      # REPLACE WORKING TREE
      # ============================================================

      - name: Replace working tree with verified ZIP source
        shell: bash
        env:
          ROOT: ${{ steps.unpack.outputs.root }}
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail

          echo "Consolidating source from:"
          echo "$ROOT"

          # Preserve Git metadata, GitHub workflows,
          # and the original ZIP until packaging is complete.
          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "_vyral_zip" \
            ! -name "$(basename "$ZIP_PATH")" \
            -exec rm -rf {} +

          cp -a "$ROOT"/. .

          rm -rf _vyral_zip

          test -f package.json

          echo
          echo "Consolidated project root:"
          ls -la


      # ============================================================
      # PROJECT IDENTITY
      # ============================================================

      - name: Verify VYRAL project identity
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          console.log("Package name:", pkg.name || "(missing)");
          console.log("Package version:", pkg.version || "(missing)");

          if (!pkg.name) {
            throw new Error("package.json does not contain a package name.");
          }

          if (!pkg.scripts || Object.keys(pkg.scripts).length === 0) {
            throw new Error("package.json contains no npm scripts.");
          }

          console.log("Project identity check passed.");
          NODE


      # ============================================================
      # SECURITY — ENV FILES
      # ============================================================

      - name: Check for environment secrets
        shell: bash
        run: |
          set -euo pipefail

          FOUND_SECRET=0

          while IFS= read -r file; do

            case "$file" in

              ./.env.example)
                ;;

              ./.env.template)
                ;;

              ./.env.sample)
                ;;

              *)
                echo "::error::Environment file detected: $file"
                FOUND_SECRET=1
                ;;

            esac

          done < <(
            find . \
              -type f \
              \( -name ".env" -o -name ".env.*" \) \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              ! -path "./.next/*" \
              ! -path "./storage-test/*"
          )

          if [[ "$FOUND_SECRET" -ne 0 ]]; then
            echo
            echo "::error::Production environment files must not be included."
            exit 1
          fi

          echo "✓ No real environment files detected."


      # ============================================================
      # SECURITY — CONFLICT MARKERS
      # ============================================================

      - name: Check for unresolved merge conflicts
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            -n \
            -E '^(<<<<<<<|=======|>>>>>>>)' \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            --exclude-dir=storage-test \
            .; then

            echo
            echo "::error::Unresolved Git merge conflict markers detected."
            exit 1

          fi

          echo "✓ No unresolved merge conflict markers found."


      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing VYRAL dependencies..."

          if [[ -f package-lock.json ]]; then

            echo "✓ package-lock.json found"
            echo "Using npm ci."

            npm ci \
              --no-audit \
              --no-fund

          else

            echo "::warning::No package-lock.json found."
            echo "Using npm install."

            npm install \
              --no-audit \
              --no-fund

          fi

          echo
          echo "Dependencies installed successfully."


      # ============================================================
      # VERIFY POSTGRESQL
      # ============================================================

      - name: Verify PostgreSQL service
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for PostgreSQL..."

          for attempt in {1..30}; do

            if pg_isready \
              -h localhost \
              -p 5432 \
              -U vyral \
              -d vyral_test; then

              echo "✓ PostgreSQL is ready."
              break

            fi

            if [[ "$attempt" -eq 30 ]]; then
              echo "::error::PostgreSQL did not become ready."
              exit 1
            fi

            sleep 2

          done

          echo
          echo "Locating PostgreSQL service container..."

          CONTAINER_ID="$(
            docker ps \
              --filter 'ancestor=postgres:16' \
              --format '{{.ID}}' \
              | head -1
          )"

          if [[ -z "$CONTAINER_ID" ]]; then
            echo "::error::PostgreSQL service container was not found."
            exit 1
          fi

          echo "Container: $CONTAINER_ID"

          echo
          echo "Database connection:"

          docker exec \
            "$CONTAINER_ID" \
            psql \
            -U vyral \
            -d vyral_test \
            -c "
              SELECT
                current_user,
                current_database(),
                version();
            "

          echo
          echo "Role verification:"

          docker exec \
            "$CONTAINER_ID" \
            psql \
            -U vyral \
            -d postgres \
            -c "
              SELECT
                rolname,
                rolsuper,
                rolcreatedb,
                rolcanlogin
              FROM pg_roles
              WHERE rolname = 'vyral';
            "

          echo
          echo "✓ PostgreSQL service verified."


      # ============================================================
      # APPLICATION DATABASE CONNECTION
      # ============================================================

      - name: Verify application database connection
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const { Client } = require("pg");

          const client = new Client({
            connectionString: process.env.DATABASE_URL,
          });

          (async () => {
            await client.connect();

            const result = await client.query(`
              SELECT
                current_database() AS database,
                current_user AS user,
                current_schema() AS schema
            `);

            console.log("Database:", result.rows[0].database);
            console.log("User:", result.rows[0].user);
            console.log("Schema:", result.rows[0].schema);

            await client.end();

            console.log("✓ Application database connection verified.");
          })().catch(async (error) => {
            console.error(
              "PostgreSQL application connection failed:"
            );

            console.error(error);

            try {
              await client.end();
            } catch {}

            process.exit(1);
          });
          NODE


      # ============================================================
      # TEST DATABASE ADMIN ACCESS
      # ============================================================

      - name: Verify PostgreSQL test database administration
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const { Client } = require("pg");

          const client = new Client({
            connectionString: process.env.TEST_DATABASE_ADMIN_URL,
          });

          (async () => {
            await client.connect();

            const result = await client.query(`
              SELECT
                current_user AS user,
                current_database() AS database,
                rolsuper,
                rolcreatedb,
                rolcanlogin
              FROM pg_roles
              WHERE rolname = current_user
            `);

            const row = result.rows[0];

            console.log("Admin user:", row.user);
            console.log("Database:", row.database);
            console.log("Superuser:", row.rolsuper);
            console.log("Can create databases:", row.rolcreatedb);
            console.log("Can login:", row.rolcanlogin);

            if (!row.rolcreatedb) {
              throw new Error(
                "VYRAL PostgreSQL role cannot create test databases."
              );
            }

            if (!row.rolcanlogin) {
              throw new Error(
                "VYRAL PostgreSQL role cannot login."
              );
            }

            await client.end();

            console.log(
              "✓ PostgreSQL administration access verified."
            );
          })().catch(async (error) => {
            console.error(
              "PostgreSQL administration check failed:"
            );

            console.error(error);

            try {
              await client.end();
            } catch {}

            process.exit(1);
          });
          NODE


      # ============================================================
      # DATABASE MIGRATIONS
      # ============================================================

      - name: Apply database migrations
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " DATABASE MIGRATIONS"
          echo "============================================================"

          if [[ -f drizzle.config.ts ||
                -f drizzle.config.js ]]; then

            echo "Drizzle detected."

            if npm run | grep -qE '(^|[[:space:]])db:migrate($|[[:space:]])'; then

              echo "Running npm run db:migrate..."
              npm run db:migrate

            elif npm run | grep -qE '(^|[[:space:]])migrate($|[[:space:]])'; then

              echo "Running npm run migrate..."
              npm run migrate

            elif [[ -d drizzle ]]; then

              echo "Running Drizzle migration engine..."
              npx drizzle-kit migrate

            else

              echo "::warning::Drizzle detected but no migration directory or script was found."

            fi

          elif [[ -f prisma/schema.prisma ]]; then

            echo "Prisma detected."

            if npm run | grep -qE '(^|[[:space:]])db:migrate($|[[:space:]])'; then

              npm run db:migrate

            else

              npx prisma migrate deploy

            fi

          elif npm run | grep -qE '(^|[[:space:]])db:migrate($|[[:space:]])'; then

            echo "Running db:migrate..."
            npm run db:migrate

          elif npm run | grep -qE '(^|[[:space:]])migrate($|[[:space:]])'; then

            echo "Running migrate..."
            npm run migrate

          else

            echo "::warning::No database migration system detected."
            echo "Continuing because tests may initialize the database."

          fi

          echo
          echo "✓ Database migration stage completed."


      # ============================================================
      # DATABASE HEALTH
      # ============================================================

      - name: Verify database schema
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const { Client } = require("pg");

          const client = new Client({
            connectionString: process.env.DATABASE_URL,
          });

          (async () => {
            await client.connect();

            const result = await client.query(`
              SELECT
                COUNT(*)::int AS table_count
              FROM information_schema.tables
              WHERE table_schema = 'public'
                AND table_type = 'BASE TABLE'
            `);

            const tableCount = result.rows[0].table_count;

            console.log("Public tables:", tableCount);

            if (tableCount === 0) {
              console.warn(
                "WARNING: No public database tables were detected."
              );
            } else {
              console.log(
                "✓ Database schema contains tables."
              );
            }

            await client.end();
          })().catch(async (error) => {
            console.error(error);

            try {
              await client.end();
            } catch {}

            process.exit(1);
          });
          NODE


      # ============================================================
      # TYPECHECK
      # ============================================================

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail

          if npm run | grep -qE '(^|[[:space:]])typecheck($|[[:space:]])'; then

            echo "Running typecheck..."
            npm run typecheck

          else

            echo "::warning::No typecheck script found."

          fi


      # ============================================================
      # LINT
      # ============================================================

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail

          if npm run | grep -qE '(^|[[:space:]])lint($|[[:space:]])'; then

            echo "Running lint..."
            npm run lint

          else

            echo "::warning::No lint script found."

          fi


      # ============================================================
      # TESTS
      # ============================================================

      - name: Run automated tests
        shell: bash
        run: |
          set -euo pipefail

          echo "Running VYRAL automated tests..."

          if npm run | grep -qE '(^|[[:space:]])test($|[[:space:]])'; then

            npm test

          else

            echo "::error::No test script found."
            exit 1

          fi


      # ============================================================
      # PRODUCTION BUILD
      # ============================================================

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail

          if npm run | grep -qE '(^|[[:space:]])build($|[[:space:]])'; then

            echo "Building VYRAL for production..."
            npm run build

          else

            echo "::error::No production build script found."
            exit 1

          fi


      # ============================================================
      # SOURCE STRUCTURE
      # ============================================================

      - name: Verify VYRAL source structure
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " SOURCE STRUCTURE"
          echo "============================================================"

          test -f package.json

          echo "✓ package.json"

          if [[ -d src ]]; then
            echo "✓ src/"
          else
            echo "::warning::src/ directory not found."
          fi

          if [[ -d public ]]; then
            echo "✓ public/"
          else
            echo "::warning::public/ directory not found."
          fi

          if [[ -d drizzle ]]; then
            echo "✓ drizzle/"
          fi

          if [[ -d e2e ]]; then
            echo "✓ e2e/"
          fi

          if [[ -f middleware.ts ||
                -f middleware.js ||
                -f src/middleware.ts ||
                -f src/middleware.js ]]; then
            echo "✓ Middleware detected"
          fi

          if [[ -f server.ts ||
                -f server.js ]]; then
            echo "✓ Custom server detected"
          fi

          echo
          echo "✓ VYRAL source structure verified."


      # ============================================================
      # CHECK GENERATED / TEST ARTIFACTS
      # ============================================================

      - name: Clean generated test artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf storage-test
          rm -rf coverage
          rm -rf test-results

          echo "✓ Test artifacts cleaned."


      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package verified VYRAL source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _package
          rm -f VYRAL-production-source.zip

          mkdir -p _package/VYRAL

          rsync -a ./ _package/VYRAL/ \
            --exclude=".git/" \
            --exclude="node_modules/" \
            --exclude=".next/" \
            --exclude="_package/" \
            --exclude="_vyral_zip/" \
            --exclude="storage-test/" \
            --exclude="coverage/" \
            --exclude="test-results/" \
            --exclude="*.zip" \
            --exclude=".env" \
            --exclude=".env.*" \
            --exclude="*.log"

          cd _package

          zip -qr \
            ../VYRAL-production-source.zip \
            VYRAL

          cd ..

          echo
          echo "Production source package:"
          ls -lh VYRAL-production-source.zip


      # ============================================================
      # PACKAGE CONTENT VERIFICATION
      # ============================================================

      - name: Verify production package contents
        shell: bash
        run: |
          set -euo pipefail

          test -f VYRAL-production-source.zip

          echo "Testing ZIP integrity..."

          unzip -t VYRAL-production-source.zip

          echo
          echo "Checking required files..."

          unzip -l VYRAL-production-source.zip \
            | grep -q "VYRAL/package.json"

          echo "✓ package.json included"

          if unzip -l VYRAL-production-source.zip \
            | grep -q "VYRAL/src/"; then
            echo "✓ src/ included"
          fi

          echo
          echo "Checking for forbidden artifacts..."

          if unzip -l VYRAL-production-source.zip \
            | grep -E 'node_modules/|\.next/|(^|/)\.env($|\.|/)' \
            >/dev/null; then

            echo "::error::Forbidden files detected inside production package."
            exit 1

          fi

          echo "✓ No node_modules/.next/.env artifacts detected."

          echo
          echo "✓ Production package verified."


      # ============================================================
      # CHECKSUM
      # ============================================================

      - name: Generate package checksum
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            VYRAL-production-source.zip \
            > VYRAL-production-source.zip.sha256

          echo
          cat VYRAL-production-source.zip.sha256


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload verified VYRAL package
        uses: actions/upload-artifact@v4
        with:
          name: VYRAL-production-source
          path: |
            VYRAL-production-source.zip
            VYRAL-production-source.zip.sha256
          if-no-files-found: error
          retention-days: 14


      # ============================================================
      # OPTIONAL COMMIT
      # ============================================================

      - name: Commit verified consolidated source
        if: ${{ inputs.commit_changes }}
        shell: bash
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " COMMITTING VERIFIED SOURCE"
          echo "============================================================"

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Do not commit generated package artifacts.
          rm -f "$ZIP_PATH"
          rm -f VYRAL-production-source.zip
          rm -f VYRAL-production-source.zip.sha256

          rm -rf _package

          rm -rf storage-test
          rm -rf coverage
          rm -rf test-results

          echo
          echo "Git status before commit:"
          git status --short

          git add -A

          if git diff --cached --quiet; then

            echo
            echo "No source changes detected."
            exit 0

          fi

          echo
          echo "Changes that will be committed:"
          git status --short

          git commit \
            -m "Consolidate and verify VYRAL production source"

          git push origin HEAD:main

          echo
          echo "✓ Verified VYRAL source committed to main."


      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: Final verification summary
        if: always()
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo " VYRAL CONSOLIDATION PIPELINE"
          echo "============================================================"
          echo
          echo "Project:"
          echo "  VYRAL"
          echo
          echo "Pipeline:"
          echo "  ✓ ZIP located"
          echo "  ✓ ZIP extracted"
          echo "  ✓ Project root detected"
          echo "  ✓ Project identity verified"
          echo "  ✓ Source consolidated"
          echo "  ✓ Environment-file security check"
          echo "  ✓ Merge-conflict check"
          echo "  ✓ Dependencies installed"
          echo "  ✓ PostgreSQL service verified"
          echo "  ✓ Application database connection verified"
          echo "  ✓ Test database administration verified"
