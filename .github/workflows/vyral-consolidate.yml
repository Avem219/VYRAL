name: VYRAL Consolidate, Verify & Package

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: "Commit the verified consolidated source back to main"
        required: true
        default: false
        type: boolean

      zip_path:
        description: "Path to the VYRAL ZIP file in the repository"
        required: true
        default: "VYRAL_consolidated_full_build.zip"
        type: string

permissions:
  contents: write

concurrency:
  group: vyral-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    name: Consolidate, Test & Package VYRAL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: vyral
          POSTGRES_PASSWORD: vyral
          POSTGRES_DB: vyral_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U vyral -d vyral_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Completely isolated CI database.
      DATABASE_URL: postgresql://vyral:vyral@localhost:5432/vyral_test
      DIRECT_URL: postgresql://vyral:vyral@localhost:5432/vyral_test

      NODE_ENV: test
      CI: true

      AUTH_SECRET: github-actions-vyral-test-secret

      # Never use production storage during CI.
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_DIR: ./storage-test

      NEXT_TELEMETRY_DISABLED: 1

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. NODE
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "Git:"
          git --version

          echo "Working directory:"
          pwd


      # ============================================================
      # 3. LOCATE UPLOADED ZIP
      # ============================================================

      - name: Locate VYRAL ZIP
        id: locate_zip
        shell: bash
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail

          echo "Looking for ZIP:"
          echo "$ZIP_PATH"

          if [[ ! -f "$ZIP_PATH" ]]; then
            echo "::error::VYRAL ZIP was not found at: $ZIP_PATH"
            echo
            echo "ZIP files currently present in repository:"
            find . \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              -not -path "./.git/*" \
              -print

            exit 1
          fi

          echo "ZIP found:"
          ls -lh "$ZIP_PATH"

          echo "zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 4. EXTRACT ZIP
      # ============================================================

      - name: Extract VYRAL ZIP
        id: unpack
        shell: bash
        env:
          ZIP_PATH: ${{ steps.locate_zip.outputs.zip }}
        run: |
          set -euo pipefail

          rm -rf _vyral_zip
          mkdir -p _vyral_zip

          echo "Extracting:"
          echo "$ZIP_PATH"

          unzip -q "$ZIP_PATH" -d _vyral_zip

          echo
          echo "Extracted structure:"
          find _vyral_zip \
            -maxdepth 3 \
            -type f \
            | head -100

          # ----------------------------------------------------------
          # Detect whether the ZIP contains:
          #
          # _vyral_zip/package.json
          #
          # or:
          #
          # _vyral_zip/VYRAL/package.json
          #
          # or another single project directory.
          # ----------------------------------------------------------

          ROOT="_vyral_zip"

          if [[ -f "$ROOT/package.json" ]]; then
            echo "Project root detected directly in ZIP."
          else
            candidates=()

            while IFS= read -r candidate; do
              candidates+=("$candidate")
            done < <(
              find "$ROOT" \
                -mindepth 1 \
                -maxdepth 3 \
                -type f \
                -name package.json \
                -print
            )

            if [[ "${#candidates[@]}" -eq 0 ]]; then
              echo "::error::No package.json was found inside the uploaded ZIP."
              exit 1
            fi

            if [[ "${#candidates[@]}" -gt 1 ]]; then
              echo "::warning::Multiple package.json files detected:"
              printf '%s\n' "${candidates[@]}"
            fi

            PACKAGE_FILE="${candidates[0]}"
            ROOT="$(dirname "$PACKAGE_FILE")"
          fi

          echo
          echo "Detected VYRAL project root:"
          echo "$ROOT"

          test -f "$ROOT/package.json"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 5. VERIFY PROJECT BEFORE REPLACING REPOSITORY
      # ============================================================

      - name: Validate extracted VYRAL project
        shell: bash
        env:
          ROOT: ${{ steps.unpack.outputs.root }}
        run: |
          set -euo pipefail

          echo "Validating project:"
          echo "$ROOT"

          test -f "$ROOT/package.json"

          if [[ -f "$ROOT/package-lock.json" ]]; then
            echo "package-lock.json found."
          else
            echo "No package-lock.json found."
            echo "The workflow will generate one using npm install."
          fi

          if [[ -f "$ROOT/drizzle.config.ts" || -f "$ROOT/drizzle.config.js" ]]; then
            echo "Drizzle configuration detected."
          fi

          if [[ -d "$ROOT/drizzle" ]]; then
            echo "Drizzle migrations directory detected."
          fi

          echo
          echo "Package:"
          node -e "
            const p = require('./$ROOT/package.json');
            console.log('name:', p.name || '(unnamed)');
            console.log('version:', p.version || '(none)');
            console.log('scripts:', Object.keys(p.scripts || {}).join(', '));
          "


      # ============================================================
      # 6. CONSOLIDATE ZIP INTO WORKING TREE
      # ============================================================

      - name: Replace working tree with verified ZIP source
        shell: bash
        env:
          ROOT: ${{ steps.unpack.outputs.root }}
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail

          echo "Consolidating source from:"
          echo "$ROOT"

          # Preserve Git metadata, workflow files, uploaded ZIP,
          # and extraction directory until copying is complete.
          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "_vyral_zip" \
            ! -name "$(basename "$ZIP_PATH")" \
            -exec rm -rf {} +

          cp -a "$ROOT"/. .

          rm -rf _vyral_zip

          test -f package.json

          echo
          echo "Consolidated project:"
          ls -la


      # ============================================================
      # 7. CHECK FOR SECRET FILES
      # ============================================================

      - name: Check for environment secrets
        shell: bash
        run: |
          set -euo pipefail

          FOUND_SECRET=0

          while IFS= read -r file; do
            case "$file" in
              ./.env.example)
                ;;
              ./.env.template)
                ;;
              ./.env.sample)
                ;;
              *)
                echo "::error::Secret environment file detected: $file"
                FOUND_SECRET=1
                ;;
            esac
          done < <(
            find . \
              -type f \
              \( -name ".env" -o -name ".env.*" \) \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              ! -path "./.next/*" \
              ! -path "./storage-test/*"
          )

          if [[ "$FOUND_SECRET" -ne 0 ]]; then
            echo
            echo "Remove production environment files before packaging."
            exit 1
          fi

          echo "No secret environment files detected."


      # ============================================================
      # 8. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing VYRAL dependencies..."

          if [[ -f package-lock.json ]]; then
            echo "package-lock.json found."
            echo "Using npm ci for reproducible installation."

            npm ci \
              --no-audit \
              --no-fund

          else
            echo "No package-lock.json found."
            echo "Using npm install to create the lockfile."

            npm install \
              --no-audit \
              --no-fund
          fi

          echo
          echo "Dependencies installed successfully."


      # ============================================================
      # 9. DATABASE CONNECTION CHECK
      # ============================================================

      - name: Verify PostgreSQL connection
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const { Client } = require("pg");

          const client = new Client({
            connectionString: process.env.DATABASE_URL,
          });

          (async () => {
            await client.connect();

            const result = await client.query(
              "SELECT current_database() AS database, current_user AS user"
            );

            console.log("Database:", result.rows[0].database);
            console.log("User:", result.rows[0].user);

            await client.end();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE


      # ============================================================
      # 10. DATABASE MIGRATIONS
      # ============================================================

      - name: Apply isolated database migrations
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing isolated PostgreSQL database..."

          # ----------------------------------------------------------
          # Drizzle is the canonical VYRAL database layer.
          # ----------------------------------------------------------

          if [[ -f drizzle.config.ts || -f drizzle.config.js ]]; then

            echo "Drizzle configuration detected."

            if [[ -d drizzle ]]; then
              echo "Drizzle migrations directory detected."
              npx drizzle-kit migrate
            else
              echo "::warning::Drizzle config exists but no drizzle directory was found."
              echo "Attempting npm migration script if available."

              if npm run | grep -qE '(^|[[:space:]])db:migrate($|[[:space:]])'; then
                npm run db:migrate
              elif npm run | grep -qE '(^|[[:space:]])migrate($|[[:space:]])'; then
                npm run migrate
              else
                echo "::warning::No Drizzle migration directory or migration script detected."
              fi
            fi

          # ----------------------------------------------------------
          # Optional Prisma support.
          #
          # NEVER use "prisma migrate dev" against CI or production.
          # ----------------------------------------------------------

          elif [[ -f prisma/schema.prisma ]]; then

            echo "Prisma schema detected."

            if npm run | grep -qE '(^|[[:space:]])db:migrate($|[[:space:]])'; then
              npm run db:migrate
            else
              npx prisma migrate deploy
            fi

          # ----------------------------------------------------------
          # Generic migration scripts.
          # ----------------------------------------------------------

          elif npm run | grep -qE '(^|[[:space:]])db:migrate($|[[:space:]])'; then

            npm run db:migrate

          elif npm run | grep -qE '(^|[[:space:]])migrate($|[[:space:]])'; then

            npm run migrate

          else

            echo "::warning::No database migration system detected."
            echo "Continuing because the project may initialize its database inside tests."

          fi


      # ============================================================
      # 11. TYPECHECK
      # ============================================================

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail

          if npm run | grep -qE '(^|[[:space:]])typecheck($|[[:space:]])'; then
            npm run typecheck
          else
            echo "No typecheck script found."
          fi


      # ============================================================
      # 12. LINT
      # ============================================================

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail

          if npm run | grep -qE '(^|[[:space:]])lint($|[[:space:]])'; then
            npm run lint
          else
            echo "No lint script found."
          fi


      # ============================================================
      # 13. AUTOMATED TESTS
      # ============================================================

      - name: Run automated tests
        shell: bash
        run: |
          set -euo pipefail

          if npm run | grep -qE '(^|[[:space:]])test($|[[:space:]])'; then
            npm test
          else
            echo "::warning::No test script found."
          fi


      # ============================================================
      # 14. PRODUCTION BUILD
      # ============================================================

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail

          if npm run | grep -qE '(^|[[:space:]])build($|[[:space:]])'; then
            npm run build
          else
            echo "::error::No production build script found."
            exit 1
          fi


      # ============================================================
      # 15. VERIFY REQUIRED VYRAL STRUCTURE
      # ============================================================

      - name: Verify VYRAL source structure
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json

          if [[ -d src ]]; then
            echo "src/ present"
          else
            echo "::warning::src/ directory not found."
          fi

          if [[ -d public ]]; then
            echo "public/ present"
          else
            echo "::warning::public/ directory not found."
          fi

          if [[ -f server.ts || -f server.js ]]; then
            echo "Custom server detected."
          fi

          echo
          echo "VYRAL source structure verified."


      # ============================================================
      # 16. REMOVE TEST ARTIFACTS
      # ============================================================

      - name: Clean test artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf storage-test
          rm -rf coverage
          rm -rf test-results

          echo "Test artifacts cleaned."


      # ============================================================
      # 17. CREATE VERIFIED SOURCE PACKAGE
      # ============================================================

      - name: Package verified VYRAL source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _package
          rm -f VYRAL-production-source.zip

          mkdir -p _package/VYRAL

          rsync -a ./ _package/VYRAL/ \
            --exclude=".git/" \
            --exclude="node_modules/" \
            --exclude=".next/" \
            --exclude="_package/" \
            --exclude="_vyral_zip/" \
            --exclude="storage-test/" \
            --exclude="coverage/" \
            --exclude="test-results/" \
            --exclude="*.zip" \
            --exclude=".env" \
            --exclude=".env.*"

          cd _package

          zip -qr ../VYRAL-production-source.zip VYRAL

          cd ..

          echo
          echo "Verified package created:"
          ls -lh VYRAL-production-source.zip


      # ============================================================
      # 18. VERIFY GENERATED ZIP
      # ============================================================

      - name: Verify packaged ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f VYRAL-production-source.zip

          unzip -t VYRAL-production-source.zip

          echo
          echo "ZIP integrity verified."


      # ============================================================
      # 19. UPLOAD VERIFIED ARTIFACT
      # ============================================================

      - name: Upload verified VYRAL package
        uses: actions/upload-artifact@v4
        with:
          name: VYRAL-production-source
          path: VYRAL-production-source.zip
          if-no-files-found: error
          retention-days: 14


      # ============================================================
      # 20. COMMIT VERIFIED SOURCE
      # ============================================================

      - name: Commit verified consolidated source
        if: ${{ inputs.commit_changes }}
        shell: bash
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail

          echo "Preparing verified source commit..."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Do not commit the uploaded consolidation ZIP.
          rm -f "$ZIP_PATH"

          # Do not commit generated packaging/test directories.
          rm -rf _package
          rm -rf storage-test
          rm -rf coverage
          rm -rf test-results

          # The generated package-lock.json is intentionally retained.
          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          echo
          echo "Changes that will be committed:"
          git status --short

          git commit \
            -m "Consolidate and verify VYRAL production source"

          git push origin HEAD:main


      # ============================================================
      # 21. FINAL STATUS
      # ============================================================

      - name: Final verification summary
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo " VYRAL CONSOLIDATION COMPLETE"
          echo "============================================================"
          echo
          echo "✓ ZIP extracted"
          echo "✓ Source consolidated"
          echo "✓ Dependencies installed"
          echo "✓ PostgreSQL verified"
          echo "✓ Database migration stage completed"
          echo "✓ Typecheck completed"
          echo "✓ Lint completed"
          echo "✓ Tests completed"
          echo "✓ Production build completed"
          echo "✓ Secret-file check completed"
          echo "✓ Production source ZIP created"
          echo "✓ ZIP integrity verified"
          echo "✓ Artifact uploaded"
          echo
          echo "VYRAL is ready for the next deployment stage."
          echo "============================================================"
