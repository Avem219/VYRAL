name: Extract VYRAL Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract VYRAL build ZIP
        run: |
          set -e

          test -f VYRAL_glassmorphic_mobile_desktop_build.zip

          mkdir .vyral_extract
          unzip -q VYRAL_glassmorphic_mobile_desktop_build.zip -d .vyral_extract

          cp -a .vyral_extract/. .

          rm -rf .vyral_extract
          rm -f VYRAL_glassmorphic_mobile_desktop_build.zip

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract VYRAL production build"
          git push
