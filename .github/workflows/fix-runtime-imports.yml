name: Fix Runtime Imports

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-runtime-imports:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect package manager
        id: package-manager
        shell: bash
        run: |
          if [ -f "package-lock.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          elif [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f "package.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          else
            echo "manager=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable Corepack
        if: steps.package-manager.outputs.manager == 'yarn' || steps.package-manager.outputs.manager == 'pnpm'
        shell: bash
        run: corepack enable

      - name: Install dependencies with npm
        if: steps.package-manager.outputs.manager == 'npm'
        shell: bash
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Install dependencies with Yarn
        if: steps.package-manager.outputs.manager == 'yarn'
        shell: bash
        run: yarn install --frozen-lockfile

      - name: Install dependencies with pnpm
        if: steps.package-manager.outputs.manager == 'pnpm'
        shell: bash
        run: |
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile

      - name: No Node dependencies
        if: steps.package-manager.outputs.manager == 'none'
        shell: bash
        run: echo "No package.json or lockfile found. Skipping dependency installation."

      - name: Run project checks
        if: steps.package-manager.outputs.manager != 'none'
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)" 2>/dev/null; then
            npm test
          else
            echo "No test script found. Skipping tests."
          fi

      - name: Commit changes if any
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Fix runtime imports"
            git push
          else
            echo "No changes to commit."
          fi

