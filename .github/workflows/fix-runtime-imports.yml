
name: Fix Runtime Imports

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-runtime-imports:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f npm-shrinkwrap.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --no-frozen-lockfile
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found. Nothing to install."
          fi

      - name: Check package scripts
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const scripts = pkg.scripts || {};

          console.log('Available scripts:');
          for (const [name, command] of Object.entries(scripts)) {
            console.log(`  ${name}: ${command}`);
          }
          NODE

      - name: TypeScript check
        if: hashFiles('tsconfig.json') != ''
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.devDependencies?.typescript || p.dependencies?.typescript ? 0 : 1)" 2>/dev/null; then
            npx tsc --noEmit
          else
            echo "TypeScript is not installed. Skipping TypeScript check."
          fi

      - name: Build project
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)" 2>/dev/null; then
            npm run build
          else
            echo "No build script found. Skipping build."
          fi

      - name: Check runtime import files
        shell: bash
        run: |
          echo "Checking repository for unresolved runtime-import markers..."

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            --exclude-dir=dist \
            --exclude-dir=build \
            --exclude='*.lock' \
            -E 'from[[:space:]]+["'\''](@/|src/)|require\(["'\''](@/|src/)' \
            . 2>/dev/null; then
            echo "Runtime import references detected."
          else
            echo "No suspicious runtime import references detected."
          fi

      - name: Check Git status
        shell: bash
        run: |
          git status --short

      - name: Commit changes if present
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Fix runtime imports"
            git push
          else
            echo "No changes were made."
          fi

