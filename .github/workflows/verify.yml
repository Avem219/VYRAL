name: Verify VYRAL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vyral
          POSTGRES_PASSWORD: vyral
          POSTGRES_DB: vyral_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vyral -d vyral_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vyral:vyral@localhost:5432/vyral_test
      NODE_ENV: test
      AUTH_SECRET: github-actions-test-secret-change-me

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
